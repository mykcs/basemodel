name: Validate Atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Keep a periodic full cross-browser regression even when recent PRs are data-only.
    - cron: '23 4 * * 0'

permissions:
  contents: read

concurrency:
  # Keep only the newest run for the same event/branch or PR. Include the event
  # type so a scheduled/manual regression cannot cancel a production main push.
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.pr_scope.outputs.scope || steps.default_scope.outputs.scope }}
    steps:
      - name: Default to full validation
        id: default_scope
        run: echo "scope=full" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head for path classification
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify PR changes
        if: ${{ github.event_name == 'pull_request' }}
        id: pr_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA")

          if (( ${#files[@]} == 0 )); then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          data_changed=false
          full_required=false

          {
            echo "### Validation scope input"
            echo
            printf -- '- `%s`\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${files[@]}"; do
            case "$file" in
              src/content/models/*.json|src/content/papers/*.json)
                data_changed=true
                ;;
              README.md|docs/*)
                ;;
              *)
                full_required=true
                ;;
            esac
          done

          if [[ "$full_required" == true ]]; then
            scope=full
          elif [[ "$data_changed" == true ]]; then
            scope=data
          else
            scope=docs
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Selected scope: **$scope**" >> "$GITHUB_STEP_SUMMARY"

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - run: npm run audit:semantic
      - run: npm run audit:claims
      - run: npm run audit:freshness
      - run: npm test

  data-smoke:
    name: E2E (chromium smoke)
    if: ${{ needs.classify.outputs.scope == 'data' }}
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
      SMOKE_GREP: 'workspace scores candidates|model explorer exposes quick filters|comparison restores selected models|model detail renders field claims|semantic unknowns stay explicit|paper detail starts a research mode|global command search finds models and papers'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify hosted Chrome
        run: google-chrome --version
      - name: Verify smoke selection
        shell: bash
        run: |
          set -euo pipefail
          listing="$(npx playwright test --project=chromium --grep "$SMOKE_GREP" --list)"
          printf '%s\n' "$listing"
          count="$(printf '%s\n' "$listing" | sed -n 's/^Total: \([0-9][0-9]*\) tests.*/\1/p')"
          if [[ "$count" != "7" ]]; then
            echo "Expected exactly 7 data-smoke tests, found ${count:-unknown}." >&2
            exit 1
          fi
      - name: Run data-driven Chromium smoke tests
        run: npx playwright test --project=chromium --grep "$SMOKE_GREP"
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-chromium-smoke-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (${{ matrix.browser }})
    if: ${{ needs.classify.outputs.scope == 'full' }}
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      # Keep the tag aligned with package-lock.json and the digest pinned so the
      # exact browser/runtime image cannot change underneath the workflow.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  gate:
    name: Validation gate
    if: ${{ always() }}
    needs: [classify, static, data-smoke, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SCOPE: ${{ needs.classify.outputs.scope }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      STATIC_RESULT: ${{ needs.static.result }}
      DATA_SMOKE_RESULT: ${{ needs.data-smoke.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Enforce selected validation tier
        shell: bash
        run: |
          set -euo pipefail

          printf 'scope=%s\nclassify=%s\nstatic=%s\ndata-smoke=%s\ne2e=%s\n' \
            "$SCOPE" "$CLASSIFY_RESULT" "$STATIC_RESULT" "$DATA_SMOKE_RESULT" "$E2E_RESULT"

          [[ "$CLASSIFY_RESULT" == success ]] || { echo "Classifier did not succeed." >&2; exit 1; }
          [[ "$STATIC_RESULT" == success ]] || { echo "Static checks did not succeed." >&2; exit 1; }

          case "$SCOPE" in
            full)
              [[ "$E2E_RESULT" == success ]] || { echo "Full E2E did not succeed." >&2; exit 1; }
              [[ "$DATA_SMOKE_RESULT" == skipped ]] || { echo "Data smoke should be skipped for full validation." >&2; exit 1; }
              ;;
            data)
              [[ "$DATA_SMOKE_RESULT" == success ]] || { echo "Data smoke did not succeed." >&2; exit 1; }
              [[ "$E2E_RESULT" == skipped ]] || { echo "Full E2E should be skipped for data validation." >&2; exit 1; }
              ;;
            docs)
              [[ "$DATA_SMOKE_RESULT" == skipped ]] || { echo "Data smoke should be skipped for docs validation." >&2; exit 1; }
              [[ "$E2E_RESULT" == skipped ]] || { echo "Full E2E should be skipped for docs validation." >&2; exit 1; }
              ;;
            *)
              echo "Unknown or empty validation scope: $SCOPE" >&2
              exit 1
              ;;
          esac

          echo "Validation gate passed for scope: $SCOPE"
