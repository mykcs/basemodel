name: Validate Atlas

on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - run: npm test
      - run: npm run build
