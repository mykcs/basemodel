name: Mac CI fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basemodel-mac-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: basemodel-mac-fallback
    runs-on: [self-hosted, basemodel-ci]
    timeout-minutes: 45
    env:
      CI: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve manual fallback range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          head="$(git rev-parse HEAD)"
          if [[ -z "$base" ]]; then
            echo "::error::Could not resolve parent commit for the manual fallback canary."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Validate CI planner contracts
        run: node --test tests/ci-plan.test.mjs tests/ci-circleci-prepare.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Deterministic verification
        run: npm run verify:deploy

      - name: Build static production artifact
        run: npm run build

      - name: Complete browser fallback canary
        env:
          CI_BASE_SHA: ${{ steps.range.outputs.base }}
          CI_HEAD_SHA: ${{ steps.range.outputs.head }}
          CI_UI_FORCE_FULL: '1'
        run: node scripts/ci-ui-gate.mjs
