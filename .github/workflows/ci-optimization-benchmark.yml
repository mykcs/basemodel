name: CI optimization benchmark

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  focused-server-browser:
    if: github.event.pull_request.draft == true && github.head_ref == 'ci/route-owned-browser-planner-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
      VERCEL_CHANGED_ROUTES: /research/seed-openevo/flow/server/,/en/research/seed-openevo/flow/server/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static production artifact
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused server browser gate
        run: |
          node scripts/ui-overflow-preflight.mjs
          npx playwright test tests/e2e/vercel-changed-route-smoke.spec.ts --project=chromium --max-failures=1
