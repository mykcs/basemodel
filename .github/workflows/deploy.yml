name: Deploy Atlas to GitHub Pages

on:
  workflow_run:
    workflows: ["Validate Atlas"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  # Prefer the newest site state when several commits land in quick succession.
  cancel-in-progress: true

jobs:
  build:
    # Publish only successful Validate Atlas runs caused by a push to this
    # repository's main branch. There is no manual bypass around validation.
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's GITHUB_SHA points at the default branch, so explicitly
          # build the exact commit that completed validation.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Read pinned Node version
        id: node_runtime
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .node-version)" >> "$GITHUB_OUTPUT"
      - name: Build and upload Pages artifact
        uses: withastro/action@b7d53628f8b666036b0238aadb0b984a2a489f26 # v6.1.1
        with:
          node-version: ${{ steps.node_runtime.outputs.version }}
        env:
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # GitHub Pages is the public fallback copy. Keep it accessible, but
          # consolidate search identity on the continuously deployable
          # Cloudflare production site to avoid duplicate-content competition.
          PUBLIC_CANONICAL_SITE_URL: https://basemodel.pages.dev
          PUBLIC_SEARCH_INDEXING: disabled

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
