name: Cloudflare candidate portability (no deployment)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# PR source may be untrusted. Never attach account secrets, use a protected
# Environment, or deploy a public preview from this workflow.
permissions:
  contents: read

concurrency:
  group: basemodel-cloudflare-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: cloudflare-static-package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Require unchanged exact-head identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove routing and Access fail-closed contracts
        run: npm run verify:workers:standby

      - name: Build exact-head Cloudflare Static Assets package
        run: npm run build:workers:standby

      - name: Seal commit identity and reject insecure artifact settings
        run: |
          set -euo pipefail
          printf '%s\n' "$CI_HEAD_SHA" > dist/standby-source-sha.txt
          node scripts/hosting/verify-worker-candidate.mjs

      - name: Validate Worker bundle with Cloudflare Wrangler without deployment
        run: npx --yes wrangler@4.156.0 deploy --dry-run --config wrangler.standby.jsonc --outdir "$RUNNER_TEMP/cloudflare-dry-run"

  gate:
    name: cloudflare-artifact-gate
    if: always()
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject skipped, canceled or failed Cloudflare package
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          test "$PACKAGE_RESULT" = success
