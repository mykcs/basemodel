name: Check Atlas data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: atlas-data-health
  cancel-in-progress: true

jobs:
  check-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run audit:semantic
      - run: npm run audit:claims
      - run: npm run audit:freshness
      - run: npm run audit:coverage
      - run: npm run audit:urls
      - name: Upload data-health reports
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: atlas-data-health
          path: reports/
          if-no-files-found: warn
      - run: echo "Data check completed; this workflow does not mutate data or deploy automatically."
