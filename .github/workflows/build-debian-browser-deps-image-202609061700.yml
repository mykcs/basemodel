name: Build Debian browser deps image 202609061700

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/ci-browser-deps/Dockerfile'
      - '.github/workflows/build-debian-browser-deps-image-202609061700.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.head_ref == 'ci/debian-browser-deps-image-202609061700'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and publish exact amd64 image
        env:
          IMAGE: ghcr.io/mykcs/basemodel-ci-browser-deps:202609061700
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker build --pull --platform linux/amd64 -t "$IMAGE" -f docker/ci-browser-deps/Dockerfile .
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE"
