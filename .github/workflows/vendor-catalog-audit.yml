name: Vendor Catalog Audit

on:
  schedule:
    # External vendor catalogs change independently from application code.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-catalog-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit vendor catalogs
        run: npm run audit:vendor-catalogs
      - name: Publish audit summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f reports/vendor-catalogs.md ]]; then
            cat reports/vendor-catalogs.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Vendor catalog report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload vendor catalog reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-catalog-audit-${{ github.run_attempt }}
          path: |
            reports/vendor-catalogs.json
            reports/vendor-catalogs.md
          retention-days: 14
          if-no-files-found: warn
