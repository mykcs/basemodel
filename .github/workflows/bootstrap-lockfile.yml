name: Bootstrap lockfile

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.head_ref == 'agent/harden-ci-followup' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Regenerate lockfile with npm 12
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- package-lock.json
          npx --yes npm@12.0.1 install --ignore-scripts --package-lock-only --save-dev --save-exact @astrojs/check@0.9.9
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): regenerate Astro checker lockfile"
          git push origin HEAD:agent/harden-ci-followup
