name: CI full-shard benchmark

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  canonical-runtime-diagnostic:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ci/route-owned-browser-planner-20260905'
    runs-on: ubuntu-24.04
    container:
      image: node:24-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
    timeout-minutes: 10
    env:
      CI: '1'
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Build static production artifact
        run: npm run build

      - name: Install canonical Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Print rendering runtime
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          npx playwright --version
          fc-match sans-serif || true
          fc-match Inter || true

      - name: Reproduce canonical figure gate
        run: >-
          npx playwright test tests/e2e/canonical-research-figures.spec.ts
          --project=chromium
          --max-failures=1
