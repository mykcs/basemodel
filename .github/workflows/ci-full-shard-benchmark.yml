name: CI full-shard benchmark

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  browser-shard:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'ci/route-owned-browser-planner-20260905'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static production artifact
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium UI shard
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          npm run test:ui -- --shard=${{ matrix.shard }}/2
          echo "ui_shard_${{ matrix.shard }}_seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Lab gate once
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          npx playwright test --config tests/e2e/lab-playwright.config.ts
          echo "lab_gate_seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"
