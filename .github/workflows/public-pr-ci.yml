name: Public PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: basemodel-public-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: '1'
  CI_FULL_BROWSER_SHARDS: '8'

jobs:
  plan:
    name: public-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      browser_total: ${{ steps.plan.outputs.browser_total }}
      shards_json: ${{ steps.plan.outputs.shards_json }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Bind exact candidate identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Plan browser allocation before runner spend
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-public-plan.mjs --github-output

  deterministic:
    name: public-deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Bind exact candidate identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Validate CI contracts
        run: node --test tests/ci-plan.test.mjs tests/ci-circleci-prepare.test.mjs tests/ci-browser-budget.test.mjs tests/ci-public-plan.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Deterministic repository gate
        run: npm run verify:deploy

      - name: Build static artifact
        run: npm run build

  browser:
    name: public-browser-${{ matrix.shard }}-of-${{ needs.plan.outputs.browser_total }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.browser_total != '0'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_json) }}
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_EXPECTED_UI_MODE: ${{ needs.plan.outputs.mode }}
      CI_BROWSER_SHARD_INDEX: ${{ matrix.shard }}
      CI_BROWSER_SHARD_TOTAL: ${{ needs.plan.outputs.browser_total }}
      CI_BROWSER_INSTALL: '1'
      CI_BROWSER_BUILD: '1'
      CI_PLAYWRIGHT_WITH_DEPS: '0'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Risk-based browser acceptance shard
        run: node scripts/ci-ui-gate.mjs

      # Adopt the already-merged main visual-evidence tail without importing
      # the independent #814 static-build ownership changes.
      - name: Retain cloud Playwright visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basemodel-ui-pr-${{ github.event.pull_request.number }}-shard-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3

  gate:
    name: public-ci-gate
    if: always()
    needs: [plan, deterministic, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every allocated public CI job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BROWSER_TOTAL: ${{ needs.plan.outputs.browser_total }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          if [ "$BROWSER_TOTAL" = 0 ]; then
            test "$BROWSER_RESULT" = skipped
          else
            test "$BROWSER_RESULT" = success
          fi

  # An independent, read-only full WebKit acceptance for the one typography
  # workstack. Keep the repository's fixed three-workflow architecture; other
  # PRs retain their existing risk-budgeted browser plan and gate.
  typography_full_webkit:
    if: github.event.pull_request.number == 898
    name: typography-full-webkit-${{ matrix.shard }}-of-4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: '1'
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Bind source and install WebKit
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          npm ci
          npx playwright install webkit

      - name: Build exact site once per shard
        run: npm run build

      - name: Run entire test:ui:all WebKit selection
        shell: bash
        env:
          WEBKIT_SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          mkdir -p evidence-logs
          printf 'head=%s\nshard=%s/4\ncommand=npm run test:ui:all -- --project=webkit --shard=%s/4 --max-failures=0\n' "$CI_HEAD_SHA" "$WEBKIT_SHARD" "$WEBKIT_SHARD" > evidence-logs/identity.txt
          # Override the normal script's fail-fast=1 only for this exhaustive
          # acceptance run: preserve all 643 test outcomes, not one failure/shard.
          npm run test:ui:all -- --project=webkit --shard="$WEBKIT_SHARD"/4 --max-failures=0 2>&1 | tee evidence-logs/webkit-results.txt
          code=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$code" | tee evidence-logs/exit-status.txt
          exit "$code"

      - name: Preserve source-bound PNG, JSON, logs and exit status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typography-898-full-webkit-shard-${{ matrix.shard }}
          path: |
            evidence-logs/**
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: error
          retention-days: 7

  typography_full_webkit_gate:
    if: always() && github.event.pull_request.number == 898
    name: typography-full-webkit-gate
    needs: [typography_full_webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all four full-suite WebKit shards
        env:
          WEBKIT_RESULT: ${{ needs.typography_full_webkit.result }}
        run: test "$WEBKIT_RESULT" = success
