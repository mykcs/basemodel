name: Public PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      force_full:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: basemodel-public-pr-ci-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  plan:
    name: public-plan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      browser_total: ${{ steps.plan.outputs.browser_total }}
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      head_ref: ${{ steps.candidate.outputs.head_ref }}
      pr_number: ${{ steps.candidate.outputs.pr_number }}
    steps:
      - name: Resolve immutable open PR candidate once
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`PR lookup failed: ${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY)
            throw new Error('Candidate must be an open PR targeting this repository main');
          if (!/^[a-f0-9]{40}$/.test(pr.head.sha) || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA))
            throw new Error('Candidate moved since the triggering event');
          const base = process.env.EXPECTED_BASE || pr.base.sha;
          if (!/^[a-f0-9]{40}$/.test(base) || !pr.head.ref || /[\r\n]/.test(pr.head.ref)) throw new Error('Invalid candidate identity');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${pr.head.sha}\nbase=${base}\nhead_ref=${pr.head.ref}\npr_number=${pr.number}\n`);
          NODE

      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Bind exact candidate identity
        env:
          CI_BASE_SHA: ${{ steps.candidate.outputs.base }}
          CI_HEAD_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Plan both engines before runner allocation
        id: plan
        env:
          CI_BASE_SHA: ${{ steps.candidate.outputs.base }}
          CI_HEAD_SHA: ${{ steps.candidate.outputs.sha }}
          CI_HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          CI_UNIFIED_BROWSER: '1'
          CI_FORCE_FULL: ${{ inputs.force_full && '1' || '0' }}
        run: node scripts/ci-public-plan.mjs --github-output

  deterministic:
    name: public-deterministic
    needs: plan
    outputs:
      build_attempt: ${{ github.run_attempt }}
    env:
      CI_BASE_SHA: ${{ needs.plan.outputs.base }}
      CI_HEAD_SHA: ${{ needs.plan.outputs.sha }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Install dependencies
        run: npm ci
      - name: Validate CI contracts
        run: node --test tests/ci-plan.test.mjs tests/ci-circleci-prepare.test.mjs tests/ci-browser-budget.test.mjs tests/ci-public-plan.test.mjs tests/ci-build-artifact.test.mjs

      - name: Deterministic repository gate
        run: npm run verify:deploy

      - name: Build static artifact once
        run: npm run build

      - name: Check document overflow once before browser allocation
        if: needs.plan.outputs.browser_total != '0'
        run: npm run ui:overflow-preflight

      - name: Seal exact-head static artifact
        if: needs.plan.outputs.browser_total != '0'
        run: node scripts/ci-build-artifact.mjs create

      - name: Upload exact-head static artifact
        if: needs.plan.outputs.browser_total != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            ci-public-build-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Validate built browser discovery contracts
        if: needs.plan.outputs.browser_total != '0'
        run: node --test tests/ci-ui-test-list.test.mjs

  browser:
    name: public-browser-focused
    needs: [plan, deterministic]
    if: needs.plan.result == 'success' && needs.deterministic.result == 'success' && needs.plan.outputs.mode == 'focused'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    env:
      CI_BASE_SHA: ${{ needs.plan.outputs.base }}
      CI_HEAD_SHA: ${{ needs.plan.outputs.sha }}
      CI_EXPECTED_UI_MODE: focused
      CI_UNIFIED_PREFLIGHT: '1'
      CI_BROWSER_SHARD_INDEX: '1'
      CI_BROWSER_SHARD_TOTAL: '1'
      CI_BROWSER_INSTALL: '0'
      CI_BROWSER_BUILD: '0'
      CI_BUILD_RUN_ATTEMPT: ${{ needs.deterministic.outputs.build_attempt }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Install dependencies
        run: npm ci

      - name: Download this run's exact-head static artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: static-build-${{ github.run_id }}-${{ needs.deterministic.outputs.build_attempt }}
          path: .

      - name: Verify exact-head static artifact
        run: node scripts/ci-build-artifact.mjs verify
      - name: Risk-based focused browser acceptance
        run: node scripts/ci-ui-gate.mjs

      - name: Retain focused browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: basemodel-ui-pr-${{ needs.plan.outputs.pr_number }}-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-browser-inventory/*.json
            test-results/**
          if-no-files-found: ignore
          retention-days: 3

  full_browser:
    name: cloud-figure-${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.total }}
    needs: [plan, deterministic]
    if: needs.plan.result == 'success' && needs.deterministic.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_json) }}
    env:
      CI_BASE_SHA: ${{ needs.plan.outputs.base }}
      CI_HEAD_SHA: ${{ needs.plan.outputs.sha }}
      CI_BUILD_RUN_ATTEMPT: ${{ needs.deterministic.outputs.build_attempt }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
      CLOUD_FIGURE_AUDIT: '1'
      FIGURE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      FIGURE_BROWSER: ${{ matrix.browser }}
      FIGURE_SHARD: ${{ matrix.shard }}
      FIGURE_SHARD_TOTAL: ${{ matrix.total }}
      FIGURE_REQUIRE_BASELINE: '1'
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Install dependencies
        run: npm ci

      - name: Pace shared-artifact downloads across complete browser shards
        shell: bash
        run: |
          set -euo pipefail
          case "$FIGURE_BROWSER" in
            chromium) offset=0 ;;
            webkit) offset=4 ;;
            *) echo 'Unsupported browser shard' >&2; exit 1 ;;
          esac
          test "$FIGURE_SHARD" -ge 1
          test "$FIGURE_SHARD" -le "$FIGURE_SHARD_TOTAL"
          sleep "$((3 * (offset + FIGURE_SHARD)))"

      - name: Download this run's exact-head static artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: static-build-${{ github.run_id }}-${{ needs.deterministic.outputs.build_attempt }}
          path: .

      - name: Verify exact-head static artifact
        run: node scripts/ci-build-artifact.mjs verify
      - name: Inventory every freshly built route and evidence owner
        run: node scripts/audit-sitewide-research-figure-widths.mjs --snapshot figure-inventory/sitewide-inventory.json

      - name: List complete canonical population before sharding
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: figure-inventory/expected-playwright.json
        run: npm run test:ui:all -- --project=${{ matrix.browser }} --list --reporter=json

      - name: Run complete UI and research figure acceptance shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: figure-inventory/playwright-run.json
          MAX_FAILURES: ${{ contains(needs.plan.outputs.head_ref, 'typography') && '0' || '1' }}
        run: node scripts/ci-ui-test-list.mjs timed test:ui:all ${{ matrix.browser }} ${{ matrix.shard }} ${{ matrix.total }} figure-inventory/expected-playwright.json scripts/ci-ui-test-timings-20261029-figure.json figure-inventory/playwright-run.json "$MAX_FAILURES"

      - name: Seal successful shard evidence
        run: node scripts/verify-cloud-figure-evidence.mjs shard .

      - name: Upload visual screenshots and error traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: figure-raw-${{ needs.plan.outputs.pr_number }}-${{ matrix.browser }}-${{ matrix.shard }}-${{ needs.plan.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            figure-inventory/*.json
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: error
          retention-days: ${{ contains(needs.plan.outputs.head_ref, 'typography') && 7 || 3 }}

  extras:
    name: public-browser-extras
    needs: [plan, deterministic]
    if: needs.plan.result == 'success' && needs.deterministic.result == 'success' && needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    env:
      CI_BASE_SHA: ${{ needs.plan.outputs.base }}
      CI_HEAD_SHA: ${{ needs.plan.outputs.sha }}
      CI_BUILD_RUN_ATTEMPT: ${{ needs.deterministic.outputs.build_attempt }}
      CI_UI_FORCE_FULL: '1'
      CI_UNIFIED_PREFLIGHT: '1'
      CI_BROWSER_INSTALL: '0'
      CI_BROWSER_BUILD: '0'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git cat-file -e "$CI_BASE_SHA^{commit}"

      - name: Install dependencies
        run: npm ci

      - name: Download this run's exact-head static artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: static-build-${{ github.run_id }}-${{ needs.deterministic.outputs.build_attempt }}
          path: .

      - name: Verify exact-head static artifact
        run: node scripts/ci-build-artifact.mjs verify
      - name: Run the distinct Public core capture and Lab cases
        run: node scripts/ci-ui-gate.mjs extras

      - name: Preserve core capture and Lab execution proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: basemodel-ui-pr-${{ needs.plan.outputs.pr_number }}-extras-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-browser-extras/*.json
            dist/__qa__/core-research-visual-signatures.json
            test-results/**
          if-no-files-found: error
          retention-days: ${{ contains(needs.plan.outputs.head_ref, 'typography') && 7 || 3 }}

  cloud-figure-evidence:
    name: cloud-figure-${{ matrix.browser }}
    permissions:
      actions: read
      contents: read
    needs: [plan, deterministic, full_browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Require every browser shard to succeed
        env:
          SHARD_RESULT: ${{ needs.full_browser.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          PREFLIGHT_RESULT: ${{ needs.plan.result }}
          FIGURE_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          case "$FIGURE_MODE" in
            full) test "$SHARD_RESULT" = success ;;
            skip|focused) test "$SHARD_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

      - name: Checkout the tested immutable candidate
        if: needs.plan.outputs.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Node 24
        if: needs.plan.outputs.mode == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download every allocated timed shard
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: figure-raw-${{ needs.plan.outputs.pr_number }}-${{ matrix.browser }}-*-${{ needs.plan.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: raw-shards
          merge-multiple: false

      - name: Verify exact population and evidence bytes
        if: needs.plan.outputs.mode == 'full'
        env:
          FIGURE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          FIGURE_BROWSER: ${{ matrix.browser }}
          FIGURE_SHARD_TOTAL: ${{ matrix.browser == 'webkit' && '8' || '4' }}
          FIGURE_REQUIRE_BASELINE: '1'
        run: node scripts/verify-cloud-figure-evidence.mjs aggregate raw-shards accepted-evidence

      - name: Upload complete verified browser evidence
        if: needs.plan.outputs.mode == 'full'
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: basemodel-figure-${{ needs.plan.outputs.pr_number }}-${{ matrix.browser }}-${{ needs.plan.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted-evidence/
          if-no-files-found: error
          retention-days: ${{ contains(needs.plan.outputs.head_ref, 'typography') && 7 || 3 }}

      - name: Wait until exact evidence artifact ID is indexed by GitHub Actions
        if: needs.plan.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          FIGURE_ACCEPTED_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: node scripts/wait-for-cloud-figure-artifact.mjs
      - name: Download the uploaded artifact for round-trip verification
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          path: artifact-roundtrip

      - name: Verify downloaded PNG and JSON bytes against manifest
        if: needs.plan.outputs.mode == 'full'
        env:
          FIGURE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          FIGURE_BROWSER: ${{ matrix.browser }}
          FIGURE_SHARD_TOTAL: ${{ matrix.browser == 'webkit' && '8' || '4' }}
          FIGURE_REQUIRE_BASELINE: '1'
        run: node scripts/verify-cloud-figure-evidence.mjs roundtrip artifact-roundtrip

  gate:
    name: public-ci-gate
    if: always()
    needs: [plan, deterministic, browser, full_browser, extras, cloud-figure-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every allocated public CI job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          BROWSER_TOTAL: ${{ needs.plan.outputs.browser_total }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          FULL_RESULT: ${{ needs.full_browser.result }}
          EXTRAS_RESULT: ${{ needs.extras.result }}
          FIGURE_RESULT: ${{ needs.cloud-figure-evidence.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          test "$FIGURE_RESULT" = success
          case "$MODE:$BROWSER_TOTAL" in
            skip:0)
              test "$BROWSER_RESULT" = skipped
              test "$FULL_RESULT" = skipped
              test "$EXTRAS_RESULT" = skipped ;;
            focused:1)
              test "$BROWSER_RESULT" = success
              test "$FULL_RESULT" = skipped
              test "$EXTRAS_RESULT" = skipped ;;
            full:12)
              test "$BROWSER_RESULT" = skipped
              test "$FULL_RESULT" = success
              test "$EXTRAS_RESULT" = success ;;
            *) exit 1 ;;
          esac

  typography_full_webkit_gate:
    if: always() && contains(github.head_ref || needs.plan.outputs.head_ref, 'typography')
    name: typography-full-webkit-gate
    needs: [plan, deterministic, full_browser, cloud-figure-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require exhaustive full-suite WebKit acceptance or intentional zero allocation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          BROWSER_TOTAL: ${{ needs.plan.outputs.browser_total }}
          WEBKIT_RESULT: ${{ needs.full_browser.result }}
          FIGURE_RESULT: ${{ needs.cloud-figure-evidence.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$DETERMINISTIC_RESULT" = success
          test "$FIGURE_RESULT" = success
          case "$MODE:$BROWSER_TOTAL" in
            skip:0) test "$WEBKIT_RESULT" = skipped ;;
            full:12) test "$WEBKIT_RESULT" = success ;;
            *) exit 1 ;;
          esac
