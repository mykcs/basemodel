name: Build CI Browser Runtime 202609061500

on:
  push:
    branches:
      - ci/playwright-prebaked-202609061500

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish exact browser runtime
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/mykcs/basemodel-ci-browser
          TAG: node24-pw1.62.1-202609061500
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --platform linux/amd64 \
            --build-arg SOURCE_SHA="$GITHUB_SHA" \
            -f .circleci/browser-runtime.Dockerfile \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker image inspect "$IMAGE:$TAG" --format '{{.Id}} {{json .Config.Labels}}'
