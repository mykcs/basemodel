name: Cloud Figure Visual Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/cloud-figure-visual-review.yml'
      - 'src/components/research/AdvisorTenEvidenceVisual.astro'
      - 'src/components/research/OpenEvoSdLoraScaling.astro'
      - 'src/components/research/OpenEvoCheckpointCurve.astro'
      - 'tests/e2e/open-evo-webshop-program-report.spec.ts'
      - 'tests/e2e/advisor-figure-paper-collision.spec.ts'
      - 'tests/e2e/advisor-paper-figure-suite.spec.ts'
      - 'tests/e2e/figure-evidence.ts'
      - 'tests/e2e/sitewide-figure-width-scope.spec.ts'
      - 'scripts/audit-sitewide-research-figure-widths.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open BaseModel PR number to test with Chromium and WebKit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: basemodel-cloud-figure-visual-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  cloud-figure-browsers:
    name: cloud-figure-${{ matrix.browser }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CLOUD_FIGURE_AUDIT: '1'
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Resolve immutable open PR candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`PR lookup failed: ${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY)
            throw new Error('Candidate must be an open PR targeting this repository main');
          if (!/^[a-f0-9]{40}$/.test(pr.head.sha) || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA))
            throw new Error('Candidate moved since the triggering event');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${pr.head.sha}\n`);
          NODE

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Bind candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          echo "## Cloud ${{ matrix.browser }} visual review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: ${{ github.event.pull_request.number || inputs.pr_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Build fresh static routes
        run: npm run build

      - name: Check document overflow before browser acceptance
        run: npm run ui:overflow-preflight

      - name: Inventory every freshly built route and evidence owner
        run: node scripts/audit-sitewide-research-figure-widths.mjs --snapshot figure-inventory/sitewide-inventory.json

      - name: Run complete UI and research figure acceptance in ${{ matrix.browser }}
        env:
          FIGURE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: npm run test:ui:all -- --project=${{ matrix.browser }} --workers=1

      - name: Verify nonempty exact-head browser evidence
        env:
          FIGURE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          FIGURE_BROWSER: ${{ matrix.browser }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          const walk = dir => readdirSync(dir, {withFileTypes:true}).flatMap(entry => {
            const path = join(dir, entry.name);
            return entry.isDirectory() ? walk(path) : [path];
          });
          const files = walk('test-results');
          for (const [pattern, count] of [[/q03-paper-\d+-.*\.png$/,6],[/q01-paper-\d+-.*\.png$/,4],[/q03-paper-geometry-.*\.json$/,6]]) {
            if (files.filter(path => pattern.test(path)).length !== count) throw new Error(`Incomplete evidence: ${pattern}`);
          }
          const entries = files.filter(path => /\.(png|json|zip|webm)$/.test(path)).map(path => {
            const data = readFileSync(path);
            if (!data.length) throw new Error(`Empty evidence: ${path}`);
            if (path.endsWith('.png') && data.subarray(0,8).toString('hex') !== '89504e470d0a1a0a') throw new Error(`Invalid PNG: ${path}`);
            if (/q03-paper-geometry|sitewide-figure-table/.test(path)) {
              const item = JSON.parse(data);
              if (item.sha !== process.env.FIGURE_SOURCE_SHA || item.browser !== process.env.FIGURE_BROWSER) throw new Error(`Wrong identity: ${path}`);
            }
            return {path,bytes:data.length,sha256:createHash('sha256').update(data).digest('hex')};
          });
          writeFileSync('figure-inventory/evidence-manifest.json',JSON.stringify({sha:process.env.FIGURE_SOURCE_SHA,browser:process.env.FIGURE_BROWSER,entries},null,2));
          NODE

      - name: Upload visual screenshots and error traces
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basemodel-figure-${{ github.event.pull_request.number || inputs.pr_number }}-${{ matrix.browser }}-${{ steps.candidate.outputs.sha }}
          path: |
            figure-inventory/*.json
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: error
          retention-days: 3

      - name: Download the uploaded artifact for round-trip verification
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          path: artifact-roundtrip

      - name: Verify downloaded PNG and JSON bytes against manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const root = 'artifact-roundtrip';
          const manifest = JSON.parse(readFileSync(join(root,'figure-inventory/evidence-manifest.json')));
          if (!manifest.entries.length) throw new Error('Empty downloaded evidence');
          for (const item of manifest.entries) {
            const bytes = readFileSync(join(root,item.path));
            if (bytes.length !== item.bytes || createHash('sha256').update(bytes).digest('hex') !== item.sha256)
              throw new Error(`Downloaded bytes differ: ${item.path}`);
          }
          console.log(`Verified ${manifest.entries.length} downloaded files for ${manifest.sha} ${manifest.browser}`);
          NODE
