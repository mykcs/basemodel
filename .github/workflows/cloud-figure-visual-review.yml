name: Cloud Figure Visual Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open BaseModel PR number to test with Chromium and WebKit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: basemodel-cloud-figure-visual-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  preflight:
    name: cloud-figure-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      build_attempt: ${{ github.run_attempt }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - name: Resolve immutable open PR candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`PR lookup failed: ${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY)
            throw new Error('Candidate must be an open PR targeting this repository main');
          if (!/^[a-f0-9]{40}$/.test(pr.head.sha) || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA))
            throw new Error('Candidate moved since the triggering event');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${pr.head.sha}\nbase=${pr.base.sha}\n`);
          NODE

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Bind candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          echo "## Cloud figure preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: ${{ github.event.pull_request.number || inputs.pr_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch exact build base
        env:
          CI_BASE_SHA: ${{ steps.candidate.outputs.base }}
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Plan figure work using the shared risk owner
        id: plan
        env:
          CI_BASE_SHA: ${{ steps.candidate.outputs.base }}
          CI_HEAD_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-public-plan.mjs --github-output
          # Explicit manual review keeps its original full-population contract.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf 'mode=full\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.plan.outputs.mode == 'full'
        run: npm ci

      - name: Deterministic repository gate
        if: steps.plan.outputs.mode == 'full'
        run: npm run verify:deploy

      - name: Build fresh static routes
        if: steps.plan.outputs.mode == 'full'
        run: npm run build


      - name: Seal exact-head static artifact
        if: steps.plan.outputs.mode == 'full'
        env:
          CI_BASE_SHA: ${{ steps.candidate.outputs.base }}
          CI_HEAD_SHA: ${{ steps.candidate.outputs.sha }}
        run: node scripts/ci-build-artifact.mjs create

      - name: Upload exact-head static artifact
        if: steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            ci-public-build-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  cloud-figure-browsers:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full'
    name: cloud-figure-${{ matrix.browser }}-${{ matrix.shard }}-of-4
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    # WebKit's full sitewide-width shard took 43.7m for 139 passing tests on PR #948.
    # Reserve headroom for setup, evidence sealing/upload and slower hosted runners.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    env:
      CI: '1'
      CI_BUILD_RUN_ATTEMPT: ${{ needs.preflight.outputs.build_attempt }}
      CI_BASE_SHA: ${{ needs.preflight.outputs.base }}
      CI_HEAD_SHA: ${{ needs.preflight.outputs.sha }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CLOUD_FIGURE_AUDIT: '1'
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - name: Resolve immutable open PR candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`PR lookup failed: ${response.status}`);
          const pr = await response.json();
          if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY)
            throw new Error('Candidate must be an open PR targeting this repository main');
          if (!/^[a-f0-9]{40}$/.test(pr.head.sha) || (process.env.EXPECTED_SHA && pr.head.sha !== process.env.EXPECTED_SHA))
            throw new Error('Candidate moved since the triggering event');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${pr.head.sha}\n`);
          NODE

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Bind candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          echo "## Cloud ${{ matrix.browser }} visual review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: ${{ github.event.pull_request.number || inputs.pr_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Fetch exact build base
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Download this run's exact-head static artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: static-build-${{ github.run_id }}-${{ needs.preflight.outputs.build_attempt }}
          path: .

      - name: Verify exact-head static artifact
        run: node scripts/ci-build-artifact.mjs verify

      - name: Check document overflow before browser acceptance
        run: npm run ui:overflow-preflight

      - name: Inventory every freshly built route and evidence owner
        run: node scripts/audit-sitewide-research-figure-widths.mjs --snapshot figure-inventory/sitewide-inventory.json

      - name: List complete canonical population before sharding
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: figure-inventory/expected-playwright.json
        run: npm run test:ui:all -- --project=${{ matrix.browser }} --list --reporter=json

      - name: Run complete UI and research figure acceptance shard
        env:
          FIGURE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: figure-inventory/playwright-run.json
        run: node scripts/ci-ui-test-list.mjs timed test:ui:all ${{ matrix.browser }} ${{ matrix.shard }} 4 figure-inventory/expected-playwright.json scripts/ci-ui-test-timings-20261029-figure.json figure-inventory/playwright-run.json

      - name: Seal successful shard evidence
        env:
          FIGURE_SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          FIGURE_BROWSER: ${{ matrix.browser }}
          FIGURE_SHARD: ${{ matrix.shard }}
        run: node scripts/verify-cloud-figure-evidence.mjs shard .

      - name: Upload visual screenshots and error traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: figure-raw-${{ github.event.pull_request.number || inputs.pr_number }}-${{ matrix.browser }}-${{ matrix.shard }}-${{ steps.candidate.outputs.sha }}
          path: |
            figure-inventory/*.json
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: error
          retention-days: 3

  cloud-figure-evidence:
    name: cloud-figure-${{ matrix.browser }}
    permissions:
      actions: read
      contents: read
    needs: [preflight, cloud-figure-browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Require every browser shard to succeed
        env:
          SHARD_RESULT: ${{ needs.cloud-figure-browsers.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FIGURE_MODE: ${{ needs.preflight.outputs.mode }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT_RESULT" = success
          case "$FIGURE_MODE" in
            full) test "$SHARD_RESULT" = success ;;
            skip|focused) test "$SHARD_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

      - name: Checkout the tested immutable candidate
        if: needs.preflight.outputs.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.cloud-figure-browsers.outputs.sha }}
          persist-credentials: false

      - name: Setup Node 24
        if: needs.preflight.outputs.mode == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download all four timed shards
        if: needs.preflight.outputs.mode == 'full'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: figure-raw-${{ github.event.pull_request.number || inputs.pr_number }}-${{ matrix.browser }}-*-${{ needs.cloud-figure-browsers.outputs.sha }}
          path: raw-shards
          merge-multiple: false

      - name: Verify exact population and evidence bytes
        if: needs.preflight.outputs.mode == 'full'
        env:
          FIGURE_SOURCE_SHA: ${{ needs.cloud-figure-browsers.outputs.sha }}
          FIGURE_BROWSER: ${{ matrix.browser }}
        run: node scripts/verify-cloud-figure-evidence.mjs aggregate raw-shards accepted-evidence

      - name: Upload complete verified browser evidence
        if: needs.preflight.outputs.mode == 'full'
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: basemodel-figure-${{ github.event.pull_request.number || inputs.pr_number }}-${{ matrix.browser }}-${{ needs.cloud-figure-browsers.outputs.sha }}
          path: accepted-evidence/
          if-no-files-found: error
          retention-days: 3

      - name: Wait until exact evidence artifact ID is indexed by GitHub Actions
        if: needs.preflight.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          FIGURE_ACCEPTED_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: node scripts/wait-for-cloud-figure-artifact.mjs
      - name: Download the uploaded artifact for round-trip verification
        if: needs.preflight.outputs.mode == 'full'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          path: artifact-roundtrip

      - name: Verify downloaded PNG and JSON bytes against manifest
        if: needs.preflight.outputs.mode == 'full'
        env:
          FIGURE_SOURCE_SHA: ${{ needs.cloud-figure-browsers.outputs.sha }}
          FIGURE_BROWSER: ${{ matrix.browser }}
        run: node scripts/verify-cloud-figure-evidence.mjs roundtrip artifact-roundtrip
