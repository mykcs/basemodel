version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "05:37"
      timezone: Pacific/Honolulu
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:07"
      timezone: Pacific/Honolulu
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
