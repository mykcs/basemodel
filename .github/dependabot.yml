version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "05:37"
      timezone: Pacific/Honolulu
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      production-patch:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
    # Runtime/framework/compiler/test-runner majors are explicit migration work,
    # not routine maintenance. Security updates are not suppressed by these
    # version-update-only ignore rules.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "astro"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@astrojs/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@playwright/test"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: chore(deps)
