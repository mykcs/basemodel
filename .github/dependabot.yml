version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "05:37"
      timezone: Pacific/Honolulu
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      production-patch:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
    # These majors are migration work, not routine maintenance. Keeping stale
    # major Dependabot PRs open causes automatic rebases to consume Cloudflare
    # Preview builds. Security updates are not suppressed by these version-only
    # SemVer-major ignore rules.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:07"
      timezone: Pacific/Honolulu
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
